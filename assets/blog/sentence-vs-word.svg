<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6dac8"/>
      <stop offset="100%" stop-color="#c4cfc8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg10)"/>
  <g>
    <text x="120" y="180" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#5a4f3f">Word averaging</text>
    <g fill="#b8a48a" opacity="0.85" font-family="ui-monospace,monospace" font-size="11">
      <rect x="120" y="200" width="60" height="28" rx="4"/>
      <text x="130" y="220" fill="#fff" font-weight="700">cat</text>
      <rect x="190" y="200" width="60" height="28" rx="4"/>
      <text x="198" y="220" fill="#fff" font-weight="700">sat</text>
      <rect x="260" y="200" width="60" height="28" rx="4"/>
      <text x="272" y="220" fill="#fff" font-weight="700">on</text>
      <rect x="330" y="200" width="60" height="28" rx="4"/>
      <text x="345" y="220" fill="#fff" font-weight="700">the</text>
      <rect x="400" y="200" width="60" height="28" rx="4"/>
      <text x="416" y="220" fill="#fff" font-weight="700">mat</text>
    </g>
    <g stroke="#b8a48a" stroke-width="2" fill="none" opacity="0.6">
      <path d="M150 240 L290 290"/>
      <path d="M220 240 L290 290"/>
      <path d="M290 240 L290 290"/>
      <path d="M360 240 L290 290"/>
      <path d="M430 240 L290 290"/>
    </g>
    <circle cx="290" cy="320" r="36" fill="#e0d3bc" stroke="#b8a48a" stroke-width="2"/>
    <text x="262" y="326" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#5a4f3f">mean(v)</text>
    <text x="220" y="385" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#7a6e5b">"the cat sat on the mat"</text>
    <text x="220" y="405" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#7a6e5b">= "the mat sat on the cat"</text>
  </g>
  <g>
    <text x="700" y="180" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="700" fill="#3e5754">Sentence transformer</text>
    <g fill="#8fb5b3" opacity="0.9" font-family="ui-monospace,monospace" font-size="11">
      <rect x="700" y="200" width="320" height="42" rx="6"/>
      <text x="715" y="225" fill="#fff" font-weight="700">MiniLM-L6 (self-attention)</text>
    </g>
    <g stroke="#8fb5b3" stroke-width="2" fill="none" opacity="0.8">
      <path d="M1020 265 L1070 320"/>
      <path d="M1020 320 L1070 320"/>
    </g>
    <circle cx="1100" cy="320" r="36" fill="#b7d2cf" stroke="#8fb5b3" stroke-width="2"/>
    <text x="1080" y="326" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#3e5754">v(384)</text>
    <text x="700" y="385" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#3e5754">two sentences → two different vectors</text>
    <text x="700" y="405" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#3e5754">word order and syntax are preserved</text>
  </g>
  <text x="100" y="540" font-family="Inter,system-ui,sans-serif" font-size="22" fill="#5a4f3f">Averaging word vectors loses the meaning</text>
</svg>
