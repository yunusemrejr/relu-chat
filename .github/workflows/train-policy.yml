name: Release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check runtime, model parity, content, and deployment safety
        run: npm test
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-results
          path: |
            dev/exports/release-test-results.json
            dev/exports/site-validation.json
          retention-days: 14
